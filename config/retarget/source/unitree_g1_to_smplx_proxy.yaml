    position_offset_local: [0.0, 0.0, 0.0]
    orientation_offset_wxyz: [1.0, 0.0, 0.0, 0.0]
    position_weight: 100.0
    orientation_weight: 5.0

  right_wrist:
    source_body: right_wrist_yaw_link
    position_offset_local: [0.0, 0.0, 0.0]
    orientation_offset_wxyz: [0.0, 0.0, 0.0, 1.0]
    position_weight: 100.0
    orientation_weight: 5.0

canonical_bones_m:
  pelvis_to_spine3: [0.0, 0.0, 0.30]
  pelvis_to_left_hip: [0.0, 0.10, -0.06]
  pelvis_to_right_hip: [0.0, -0.10, -0.06]
  thigh: 0.55
  shank: 0.52
  pelvis_to_left_shoulder: [0.0, 0.20, 0.42]
  pelvis_to_right_shoulder: [0.0, -0.20, 0.42]
  upper_arm: 0.30
  forearm: 0.28

contact:
  foot_bodies: [left_foot, right_foot]
  height_threshold_m: 0.06
  speed_threshold_mps: 0.45
  min_contact_frames: 3
  lock_contact_z_to_ground: false

smoothing:
  window: 5

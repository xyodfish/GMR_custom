    orientation_weight: 10.0

  left_shoulder:
    source_body: left_shoulder_yaw_link
    position_offset_local: [0.0, 0.0, 0.0]
    orientation_offset_wxyz: [0.70710678, 0.0, 0.70710678, 0.0]
    position_weight: 10.0
    orientation_weight: 5.0

  right_shoulder:
    source_body: right_shoulder_yaw_link
    position_offset_local: [0.0, 0.0, 0.0]
    orientation_offset_wxyz: [0.0, -0.70710678, 0.0, -0.70710678]
    position_weight: 10.0
    orientation_weight: 5.0

  left_elbow:
